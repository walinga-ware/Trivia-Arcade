# .github/workflows/validate-html.yml
name: Validate HTML

on:
  pull_request:
    branches: [master]

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate index.html
        run: |
          # Nu HTML Checker (the W3C validator). --errors-only skips warnings;
          # it exits non-zero on any error (unclosed tags, bad nesting, etc.)
          npm install --no-save vnu-jar
          java -jar node_modules/vnu-jar/build/dist/vnu.jar --errors-only index.html
